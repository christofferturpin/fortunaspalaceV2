<!DOCTYPE html>
<!--
  ┌──────────────────────────────────────────────────────────────────────────┐
  │  DRIVE — self-contained cinematic interlude (night drive w/ Fortuna)     │
  ├──────────────────────────────────────────────────────────────────────────┤
  │                                                                          │
  │  For humans:                                                             │
  │    Standalone cinematic page — no external JS, no localStorage R/W, no   │
  │    route-guards. Player steers a tiny car along an animated scrolling    │
  │    road (mouse/touch X-axis) while eating fries with Space. Speech       │
  │    bubbles fade in/out on a fixed timeline: Fortuna up front comforts    │
  │    ("Don't worry, honey." / "It'll be fine.") and a baby in the back     │
  │    coos and cries. At 33s a green BRONSON 25 MILES highway sign passes   │
  │    overhead; at 40s the screen fades to black; at 44.5s the page         │
  │    redirects to ../index.html. All CSS and JS are inlined; nothing       │
  │    here writes to wendys_palace_* keys.                                  │
  │                                                                          │
  │  For AI (terse):                                                         │
  │    loads: nothing external (inline <style> + inline <script> IIFE)       │
  │    inline route-guards: none                                             │
  │    DOM ids: #car, #bubbles, #sign, #fade, #fry-count, #stars             │
  │    flow: IIFE → sprinkle 60 stars; bind mousemove/touchmove → updateCarX │
  │      (clamps to road bounds 22%–78% w); keydown Space → eatFry (++count, │
  │      spawn .fry-pop emoji); fixed setTimeout sequence at 3/7.5/12/17/    │
  │      22.5/27/33/40/44.5s — showBubble(fortuna|baby) → sign.show →        │
  │      fade.show → location.replace('../index.html')                       │
  │    storage R/W: none                                                     │
  │    routes out: ../index.html (hard-coded redirect at 44.5s)              │
  │                                                                          │
  └──────────────────────────────────────────────────────────────────────────┘
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Bangers&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    overflow: hidden;
    background: #050608;
    color: #fff;
    width: 100%;
    height: 100%;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- ROAD ---------- */
  .road-asphalt {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 20%;
    right: 20%;
    background:
      linear-gradient(180deg, #1a1a1c 0%, #0d0d0f 50%, #1a1a1c 100%);
    border-left: 4px solid #888;
    border-right: 4px solid #888;
    box-shadow:
      inset 0 0 80px rgba(0, 0, 0, 0.7);
  }

  /* Center yellow dashed line */
  .road-center {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 8px;
    transform: translateX(-50%);
    background: repeating-linear-gradient(
      180deg,
      #f5d54a 0,
      #f5d54a 40px,
      transparent 40px,
      transparent 90px
    );
    background-size: 8px 130px;
    animation: scroll-road 0.7s linear infinite;
    box-shadow: 0 0 8px rgba(245, 213, 74, 0.4);
  }

  @keyframes scroll-road {
    from { background-position-y: 0; }
    to   { background-position-y: 130px; }
  }

  /* Stars/distant scenery */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  .stars span {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    opacity: 0.6;
    border-radius: 50%;
  }

  /* ---------- CAR ---------- */
  .car {
    position: fixed;
    bottom: 90px;
    left: 50%;
    width: 56px;
    height: 92px;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #c0c5d0 0%, #8a90a0 50%, #c0c5d0 100%);
    border: 2px solid #1a1a1a;
    border-radius: 12px 12px 14px 14px;
    box-shadow:
      0 6px 14px rgba(0, 0, 0, 0.7),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    transition: left 0.15s ease-out;
    z-index: 5;
  }

  .car-windshield {
    position: absolute;
    top: 8px;
    left: 6px;
    right: 6px;
    height: 24px;
    background: linear-gradient(180deg, #1a2a40 0%, #2a3a55 100%);
    border-radius: 6px;
    box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.6);
  }

  .car-headlight {
    position: absolute;
    top: -4px;
    width: 10px;
    height: 8px;
    background: #fff8c0;
    border-radius: 4px;
    box-shadow:
      0 -10px 30px 8px rgba(255, 240, 180, 0.55),
      0 -20px 80px 18px rgba(255, 230, 140, 0.18);
  }
  .car-headlight-l { left: 6px; }
  .car-headlight-r { right: 6px; }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed;
    top: 12px;
    left: 12px;
    font-family: 'Special Elite', 'Courier New', monospace;
    font-size: 14px;
    color: #c0c5d0;
    letter-spacing: 0.12em;
    z-index: 20;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
  }

  .hint {
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Special Elite', monospace;
    font-size: 11px;
    color: rgba(192, 197, 208, 0.55);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    z-index: 20;
    pointer-events: none;
  }

  /* ---------- BUBBLES ---------- */
  .bubble {
    position: fixed;
    color: #0a0a0a;
    border: 2px solid #0a0a0a;
    z-index: 12;
    opacity: 0;
    transform: translateY(8px) scale(0.92);
    animation: bubble-in 0.35s ease-out forwards;
    box-shadow:
      0 6px 16px rgba(0, 0, 0, 0.5),
      4px 4px 0 0 #0a0a0a;
  }

  .bubble.fade-out {
    animation: bubble-out 0.4s ease-in forwards;
  }

  /* Fortuna — handwritten cursive, larger bubble, tail down to front of car */
  .bubble.fortuna {
    background: #f6efde;
    border-radius: 18px;
    padding: 8px 20px 10px;
    font-family: 'Caveat', 'Brush Script MT', cursive;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.01em;
    line-height: 1.05;
    max-width: 260px;
  }

  .bubble.fortuna::after {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 24px;
    width: 0;
    height: 0;
    border: 12px solid transparent;
    border-top-color: #f6efde;
    border-bottom: 0;
  }
  .bubble.fortuna::before {
    content: '';
    position: absolute;
    bottom: -18px;
    left: 22px;
    width: 0;
    height: 0;
    border: 14px solid transparent;
    border-top-color: #0a0a0a;
    border-bottom: 0;
  }

  /* Baby — small, italic typewriter, soft pink, tail to LEFT (toward car back) */
  .bubble.baby {
    background: #fdf3f3;
    border-radius: 24px;
    padding: 6px 14px;
    font-family: 'Special Elite', 'Courier New', monospace;
    font-style: italic;
    font-size: 16px;
    letter-spacing: 0.04em;
    line-height: 1;
    max-width: 100px;
    text-align: center;
  }

  .bubble.baby::after {
    content: '';
    position: absolute;
    top: 50%;
    left: -12px;
    margin-top: -10px;
    width: 0;
    height: 0;
    border: 10px solid transparent;
    border-right-color: #fdf3f3;
    border-left: 0;
  }
  .bubble.baby::before {
    content: '';
    position: absolute;
    top: 50%;
    left: -16px;
    margin-top: -12px;
    width: 0;
    height: 0;
    border: 12px solid transparent;
    border-right-color: #0a0a0a;
    border-left: 0;
  }

  @keyframes bubble-in {
    0%   { opacity: 0; transform: translateY(8px) scale(0.92); }
    60%  { opacity: 1; transform: translateY(-2px) scale(1.04); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes bubble-out {
    to { opacity: 0; transform: translateY(-8px) scale(0.95); }
  }

  /* ---------- BRONSON SIGN ---------- */
  .sign {
    position: fixed;
    top: -200px;
    right: 8%;
    background: #0d4f1e;
    color: #fff;
    padding: 16px 36px 18px;
    font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
    z-index: 6;
    border-radius: 6px;
    text-align: center;
    box-shadow:
      inset 0 0 0 3px #0d4f1e,
      inset 0 0 0 5px #fff,
      0 8px 24px rgba(0, 0, 0, 0.7);
    line-height: 1;
    text-shadow: 0 0 1px rgba(0, 0, 0, 0.4);
  }

  .sign-name {
    font-size: 44px;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  .sign-distance {
    font-size: 22px;
    letter-spacing: 0.12em;
    font-weight: 700;
    opacity: 0.95;
  }

  .sign-rule {
    width: 80%;
    height: 2px;
    background: #fff;
    margin: 4px auto 6px;
    opacity: 0.7;
  }

  .sign.show {
    animation: sign-pass 7s linear forwards;
  }

  @keyframes sign-pass {
    from { top: -200px; transform: scale(0.6); }
    50%  { transform: scale(1); }
    to   { top: 110%; transform: scale(1.4); }
  }

  /* ---------- FRY POP ---------- */
  .fry-pop {
    position: fixed;
    font-size: 28px;
    z-index: 8;
    pointer-events: none;
    animation: fry-up 0.85s ease-out forwards;
  }

  @keyframes fry-up {
    0%   { opacity: 1; transform: translate(-50%, 0) scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -70px) scale(0.6); }
  }

  /* ---------- FADE OVERLAY ---------- */
  .fade-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    pointer-events: none;
    opacity: 0;
    z-index: 100;
    transition: opacity 4s ease-in;
  }
  .fade-overlay.show { opacity: 1; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 700px) {
    .road-asphalt { left: 10%; right: 10%; }
    .car { width: 44px; height: 76px; bottom: 70px; }
    .car-windshield { height: 18px; }
    .bubble { font-size: 18px; max-width: 200px; }
    .sign { font-size: 30px; padding: 14px 24px; }
  }
</style>
</head>
<body>

<div class="road-asphalt"></div>
<div class="road-center"></div>
<div class="stars" id="stars"></div>

<div class="car" id="car">
  <div class="car-windshield"></div>
  <div class="car-headlight car-headlight-l"></div>
  <div class="car-headlight car-headlight-r"></div>
</div>

<div class="hud">
  Fries eaten: <span id="fry-count">0</span>
</div>

<div id="bubbles"></div>

<div class="sign" id="sign">
  <div class="sign-name">BRONSON</div>
  <div class="sign-rule"></div>
  <div class="sign-distance">25 MILES</div>
</div>

<div class="fade-overlay" id="fade"></div>

<div class="hint">drag / mouse — steer · space — eat fry</div>

<script>
(function () {
  const car = document.getElementById('car');
  const bubblesEl = document.getElementById('bubbles');
  const sign = document.getElementById('sign');
  const fade = document.getElementById('fade');
  const fryCount = document.getElementById('fry-count');
  const stars = document.getElementById('stars');

  let fries = 0;
  let carX = window.innerWidth / 2;

  // Sprinkle stars
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('span');
    const onLeft = Math.random() < 0.5;
    s.style.left = (onLeft
      ? Math.random() * 18
      : 82 + Math.random() * 18) + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.opacity = (0.25 + Math.random() * 0.55).toFixed(2);
    stars.appendChild(s);
  }

  function bounds() {
    const w = window.innerWidth;
    const left = w * 0.22 + 30;
    const right = w * 0.78 - 30;
    return { left, right };
  }

  function updateCarX(x) {
    const b = bounds();
    carX = Math.max(b.left, Math.min(b.right, x));
    car.style.left = carX + 'px';
  }
  updateCarX(carX);

  document.addEventListener('mousemove', (e) => updateCarX(e.clientX));
  document.addEventListener('touchmove', (e) => {
    if (e.touches.length) updateCarX(e.touches[0].clientX);
  }, { passive: true });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ') {
      eatFry();
      e.preventDefault();
    }
  });

  function eatFry() {
    fries += 1;
    fryCount.textContent = fries;
    const f = document.createElement('div');
    f.className = 'fry-pop';
    f.textContent = '🍟';
    f.style.left = carX + 'px';
    f.style.bottom = '170px';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 900);
  }

  function showBubble(text, opts) {
    opts = opts || {};
    const b = document.createElement('div');
    b.className = 'bubble ' + (opts.baby ? 'baby' : 'fortuna');
    b.textContent = text;
    bubblesEl.appendChild(b);

    // Measure after insertion
    const rect = b.getBoundingClientRect();
    const carRect = car.getBoundingClientRect();

    if (opts.baby) {
      // Baby is in the back seat. Bubble appears to the right of the car's
      // back half, tail pointing left into the car.
      const onRight = (opts.side || 'right') === 'right';
      const x = onRight
        ? carRect.right + 14
        : carRect.left - rect.width - 14;
      const y = carRect.top + carRect.height * 0.55 - rect.height / 2;
      b.style.left = x + 'px';
      b.style.top = y + 'px';
    } else {
      // Fortuna is up front. Bubble above the car, tail down to top of car.
      const offset = (opts.offset || 0);
      const tailX = carRect.left + carRect.width / 2 + offset;
      // Tail anchor on bubble is ~30px from its left edge (matches CSS::after left).
      b.style.left = (tailX - 30) + 'px';
      b.style.top = (carRect.top - 30 - rect.height) + 'px';
    }

    setTimeout(() => {
      b.classList.add('fade-out');
      setTimeout(() => b.remove(), 450);
    }, opts.duration || 3500);
  }

  // ---------- Sequence ----------
  setTimeout(() => showBubble("Don't worry, honey.", { offset: -30 }), 3000);
  setTimeout(() => showBubble('Coo', { baby: true, side: 'right', duration: 2200 }), 7500);
  setTimeout(() => showBubble("It'll be fine.", { offset: 30 }), 12000);
  setTimeout(() => showBubble("We'll figure it out.", { offset: -20 }), 17000);
  setTimeout(() => showBubble('wah', { baby: true, side: 'left', duration: 2200 }), 22500);
  setTimeout(() => showBubble("It'll be fine.", { offset: 20 }), 27000);

  // Bronson sign at 33s
  setTimeout(() => sign.classList.add('show'), 33000);

  // Fade to black at 40s
  setTimeout(() => fade.classList.add('show'), 40000);

  // Redirect to homepage at 44.5s
  setTimeout(() => location.replace('../index.html'), 44500);
})();
</script>

</body>
</html>
