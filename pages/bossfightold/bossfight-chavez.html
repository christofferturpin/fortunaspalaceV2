<!DOCTYPE html>
<!--
  ┌──────────────────────────────────────────────────────────────────────────┐
  │  BOSSFIGHT — CHAVEZ — heads-up Hold'em vs. Agent Chavez (boss #1)        │
  ├──────────────────────────────────────────────────────────────────────────┤
  │                                                                          │
  │  For humans:                                                             │
  │    Boss #1. Visual register: heavenly parchment — cream and gold leaf,   │
  │    a single huge ophanim wheel rotating slowly behind the felt, eye-     │
  │    glyphs feathering across the page. Card backs carry an eye-on-wheel   │
  │    motif in lapis. Cards are ivory with seraph-red hearts/diamonds.      │
  │                                                                          │
  │    Conceit: Chavez is conceivably an old retired social worker playing   │
  │    at the same casino who sees abuse and reports it — but he's also a    │
  │    racist old dickhead. The frame: Fortuna is killing the cops who come  │
  │    after her.                                                            │
  │                                                                          │
  │    NOTE — this page was rebuilt to match the shared infrastructure used  │
  │    by the other four bosses (poker-base.css + chavez-theme.css +         │
  │    page-generic.js). The original elaborate setup (chavez.css, page.js,  │
  │    kaomoji portrait, letter dispatch, threshold ladder, fights-completed │
  │    counter, child-stat reward on win) lives unreferenced as backups in   │
  │    [css/bossfight/chavez.css] and [js/bossfight/page.js].                │
  │                                                                          │
  │  For AI (terse):                                                         │
  │    loads: ../js/bossfight/audio.js, ../js/bossfight/holdem.js,           │
  │      ../js/bossfight/ai.js, ../js/bossfight/page-generic.js              │
  │    css: ../css/base.css, ../css/bossfight/poker-base.css,                │
  │      ../css/bossfight/chavez-theme.css                                   │
  │    inline route-guards: NONE on entry. page-generic.js handles a         │
  │      complete+!won persist record by showing the splash whose Back       │
  │      button routes to child-died.html (loss is terminal).                │
  │    window.BossConfig = { slug:'chavez', name:'AGENT CHAVEZ',             │
  │      startingStacks:{playerChips:100,oppChips:50},                       │
  │      tells:{idle:'writing on the pad',thinking:'considering…',           │
  │             busted:'broken'} }                                           │
  │    DOM ids: same shape as the other boss pages                           │
  │    storage R/W:                                                          │
  │      R/W: wendys_palace_boss_chavez {active, complete, won, snapshot}    │
  │      W (on win): wendys_palace_bosses_beaten (append 'chavez')           │
  │    routes out: index.html (on win via end-splash Back),                  │
  │      child-died.html (on loss via end-splash Back)                       │
  │                                                                          │
  └──────────────────────────────────────────────────────────────────────────┘
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Chavez vs. You — Fortuna's Palace</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/bossfight/poker-base.css">
  <link rel="stylesheet" href="../css/bossfight/chavez-theme.css">
</head>
<body class="bf-body bf-theme-chavez">

  <header class="bf-header">
    <h1 class="bf-title">AGENT CHAVEZ <span class="bf-vs">vs.</span> YOU</h1>
    <div class="bf-meta">
      Hand <span id="bf-hand">1</span>
      <span class="bf-meta-sep">·</span>
      Blinds <span id="bf-blinds">1/2</span>
    </div>
  </header>

  <main class="bf-table">

    <section class="bf-seat bf-seat-chavez" id="bf-chavez-seat">
      <div class="bf-seat-head">
        <div class="bf-seat-name">AGENT CHAVEZ <span class="bf-seat-tag">CSWS</span></div>
        <div class="bf-boss-tell" id="bf-boss-tell">writing on the pad</div>
        <div class="bf-bet" id="bf-chavez-bet"></div>
      </div>
      <div class="bf-last-move" id="bf-chavez-last">last move · —</div>
      <p class="bf-chz-quote" style="margin:0 0 8px;font-family:'IM Fell English',serif;font-style:italic;font-size:13px;color:var(--bf-fg-dim);line-height:1.45;">
        — Eyes within eyes. Wheels within wheels. Pretention within pretention. —
      </p>
      <div class="bf-cards bf-cards-chavez" id="bf-chavez-cards"></div>
    </section>

    <section class="bf-felt">
      <div class="bf-street" id="bf-street">PREFLOP</div>
      <div class="bf-boss-avatar" id="bf-boss-avatar" aria-hidden="true"></div>
      <div class="bf-turn-status" id="bf-turn-status">— hand begins —</div>
      <div class="bf-community" id="bf-community"></div>
    </section>

    <section class="bf-seat bf-seat-player" id="bf-player-seat">
      <div class="bf-seat-head">
        <div class="bf-seat-name">YOU</div>
      </div>

      <div class="bf-announce" id="bf-announce" aria-live="polite"></div>

      <div class="bf-stakes" id="bf-stakes">
        <div class="bf-stakes-side bf-stakes-you">
          <span class="bf-stakes-label">YOU</span>
          <span class="bf-stakes-value" id="bf-stakes-player">100</span>
        </div>
        <div class="bf-stakes-mid" id="bf-stakes-mid">
          <span class="bf-stakes-label">POT</span>
          <span class="bf-stakes-value bf-stakes-pot-value" id="bf-stakes-pot">0</span>
          <span class="bf-stakes-sub" id="bf-stakes-call"></span>
        </div>
        <div class="bf-stakes-side bf-stakes-them">
          <span class="bf-stakes-label">CHAVEZ</span>
          <span class="bf-stakes-value" id="bf-stakes-chavez">50</span>
        </div>
      </div>

      <div class="bf-bet" id="bf-player-bet"></div>

      <div class="bf-actions" id="bf-actions">
        <div class="bf-action-row">
          <button class="bf-action bf-action-fold" id="bf-act-fold" type="button">Fold</button>
          <button class="bf-action bf-action-passive" id="bf-act-passive" type="button">Check</button>
          <button class="bf-action bf-action-aggro" id="bf-act-aggro" type="button">Bet 2</button>
        </div>
        <div class="bf-sizing" id="bf-sizing">
          <div class="bf-preset-row">
            <button class="bf-preset" data-preset="min"  type="button">Min</button>
            <button class="bf-preset" data-preset="half" type="button">½ Pot</button>
            <button class="bf-preset" data-preset="pot"  type="button">Pot</button>
            <button class="bf-preset" data-preset="all"  type="button">All-in</button>
          </div>
          <div class="bf-slider-row">
            <input type="range" id="bf-raise-amount" min="0" max="0" value="0">
            <div class="bf-size-value">to <span id="bf-raise-value">0</span></div>
          </div>
        </div>
      </div>

      <div class="bf-cards bf-cards-player" id="bf-player-cards"></div>
      <div class="bf-hand-strength" id="bf-hand-strength"></div>
    </section>

  </main>

  <div class="bf-log" id="bf-log"></div>

  <script>
    window.BossConfig = {
      slug: 'chavez',
      name: 'AGENT CHAVEZ',
      startingStacks: { playerChips: 100, oppChips: 50 },
      tells: { idle: 'writing on the pad', thinking: 'considering…', busted: 'broken' },
      // Institutional cubicle face — bars are the suit collar. Frames per
      // chip-ratio mood. Cross earrings hang via chavez-theme.css; this
      // is the face proper.
      avatarFrames: {
        lost:    ['▌ ✗_✗ ▐', '▌ x_x ▐', '▌ ✘_✘ ▐', '▌ x_x ▐'],
        losing:  ['▌ ⊙;⊙ ▐', '▌ Ô~Ô ▐', '▌ ⊙;⊙ ▐', '▌ Ô_Ô ▐'],
        average: ['▌ ô_ô ▐', '▌ —_— ▐', '▌ ô_ô ▐', '▌ ô.ô ▐'],
        winning: ['▌ ¬_¬ ▐', '▌ ¬.¬ ▐', '▌ ¬_¬ ▐', '▌ ¬-¬ ▐'],
        won:     ['▌ ¬‿¬ ▐', '▌ ‿‿‿ ▐', '▌ ¬‿¬ ▐', '▌ ¬_¬ ▐'],
      },
      // Tight, methodical, by-the-book social worker. Rarely bluffs, plays
      // straight to his cards, small sizes, low randomness.
      aiStyle: {
        bluffFreq:  0.6,
        tightness:  1.3,
        aggression: 1.0,
        loose:      0.8,
        mixedness:  0.7,
      },
    };
  </script>
  <script src="../js/bossfight/audio.js"></script>
  <script src="../js/bossfight/holdem.js"></script>
  <script src="../js/bossfight/ai.js"></script>
  <script src="../js/bossfight/page-generic.js"></script>
</body>
</html>
