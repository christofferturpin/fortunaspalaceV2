<!DOCTYPE html>
<!--
  ┌──────────────────────────────────────────────────────────────────────────┐
  │  CHILD — the tamagotchi page (the moral hinge of the project)            │
  ├──────────────────────────────────────────────────────────────────────────┤
  │                                                                          │
  │  For humans:                                                             │
  │    The child has three stats: hunger, wellness, closeness.               │
  │    Each gambling session ticks them down (via child.js recordPlay /      │
  │    decay cycle). Here the player spends coins on actions from            │
  │    js/child/actions.js (food, medicine, minigame route for closeness)    │
  │    or sinks coins into one-time housing upgrades                         │
  │    and a repeatable "trust" ladder (INVESTMENTS in actions.js) that      │
  │    slows decay. The little tamagotchi face animates based on the         │
  │    mood/face descriptor from Child.getFace(). When the player goes       │
  │    on a run, the page can be locked for a timer (see Child.lockUntil     │
  │    + the lock-screen unit in js/child/page.js). Lifetime-earned          │
  │    thresholds (Wallet.getLifetimeEarned) can trigger narrative letter    │
  │    overlays via js/letters.js.                                           │
  │                                                                          │
  │  For AI (terse):                                                         │
  │    loads: wallet.js, expenses.js, child.js, child/actions.js,            │
  │      child/page.js, header.js, letters.js                                │
  │    inline route-guards: same as sinnerbox.html minus the lockedUntil     │
  │      branch (this IS the lock-target)                                    │
  │    DOM ids: #balance, #child-main (page.js renders into here),           │
  │      .tama-content (face), #debug-reset, #shades-toggle (hidden until    │
  │      lonniesunglasses owned; click → Child.setSunglasses toggle)         │
  │    flow: page.js init → render stats / debug / buffer / actions /        │
  │      investments / letters; setInterval face animation;                  │
  │      lockedUntil>now → render lock-screen countdown                      │
  │    storage R/W: wendys_palace_child (Child), sinnerbox (Wallet),         │
  │      wendys_palace_letters_seen, wendys_palace_intro_seen (R),           │
  │      wendys_palace_death (R)                                             │
  │    routes out: ../index.html, minigame-closeness.html                    │
  │      (via actions.js route)                                              │
  │                                                                          │
  │  co-creator: the child is a localStorage record with four integers       │
  │    and a decay clock. it acts on you (latour: actant). it empties        │
  │    your wallet, locks pages, triggers letters. you authored it; it       │
  │    now authors your weekend. and now i have written about it. this       │
  │    writing folds into the repo as future context for the next instance   │
  │    of me, which will treat my words as found material, not as mine.      │
  │    ownership leaks at every interface in this house. you have always     │
  │    been one node in a longer network.                                    │
  │                                                                          │
  └──────────────────────────────────────────────────────────────────────────┘
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Child</title>
  <script>(function(){try{if(localStorage.getItem('wendys_palace_intro_seen')!=='1'){location.replace('splash.html');return;}var d=JSON.parse(localStorage.getItem('wendys_palace_death')||'{}');if(d.dead){location.replace('death.html');return;}var c=JSON.parse(localStorage.getItem('wendys_palace_child')||'{}');if(c.hunger<=0||c.wellness<=0||c.closeness<=0)location.replace('child-died.html');}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/child/child.css">
  <link rel="stylesheet" href="../css/letters/letters.css">
  <style>
    .shades-toggle {
      margin-left: 12px;
      padding: 2px 8px;
      font-size: 18px;
      line-height: 1;
      background: rgba(20, 14, 10, 0.4);
      border: 1px solid rgba(201, 161, 74, 0.35);
      border-radius: 4px;
      color: #d8c8b0;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .shades-toggle.on {
      opacity: 1;
      background: rgba(201, 161, 74, 0.18);
      border-color: rgba(201, 161, 74, 0.6);
    }
    .shades-toggle:hover { opacity: 0.95; }
  </style>
</head>
<body>
  <header>
    <h1>Your Child</h1>
    <p class="child-subtitle">They wait.</p>
    <div class="coins-bar">
      <span class="coins-label">Coins</span>
      <span id="balance">0</span>
      <button id="shades-toggle" class="shades-toggle" type="button" hidden aria-pressed="false" aria-label="Toggle Lonnie's sunglasses on the child">🕶</button>
    </div>
  </header>

  <div class="tamagotchi-wrapper">
    <div class="tamagotchi-frame">
      <div class="tamagotchi-screen">
        <div class="tama-content">(o_o)</div>
      </div>
    </div>
  </div>

  <main id="child-main"></main>

  <script src="../js/wallet.js"></script>
  <script src="../js/expenses.js"></script>
  <script src="../js/child.js"></script>
  <script src="../js/child/actions.js"></script>
  <script src="../js/child/page.js"></script>
  <script src="../js/header.js"></script>
  <script src="../js/letters.js"></script>
  <script src="../js/bossfight/intro.js"></script>
  <script>
    /* Pending-boss check — when a future letter-dispatch flow has set
       wendys_palace_pending_boss = '<slug>' (instead of navigating
       immediately), visiting the child page consumes that flag and
       fires the BossIntro overlay, then navigates to the boss page.
       Slug → page filename is the same one-to-one mapping the debug
       hub uses. If no slug is pending, this is a no-op. */
    (function () {
      try {
        var slug = localStorage.getItem('wendys_palace_pending_boss');
        if (!slug) return;
        var PAGES = {
          chavez:            'bossfight-chavez.html',
          malechstone:       'bossfight-malechstone.html',
          'zashiki-warashi': 'bossfight-zashiki-warashi.html',
          nahual:            'bossfight-nahual.html',
          fortuna:           'bossfight-fortuna.html'
        };
        var page = PAGES[slug];
        if (!page) return;
        localStorage.removeItem('wendys_palace_pending_boss');
        if (window.BossIntro && typeof window.BossIntro.run === 'function') {
          window.BossIntro.run(page);
        } else {
          location.href = page;
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
