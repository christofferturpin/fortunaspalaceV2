<!DOCTYPE html>
<!--
  ┌──────────────────────────────────────────────────────────────────────────┐
  │  GIFT SHOP — BOTTLECAP (Bottle Cap, 3,200 coins)                         │
  ├──────────────────────────────────────────────────────────────────────────┤
  │                                                                          │
  │  For humans:                                                             │
  │    Item page for a bottle cap from Ray's pizza-box Go board. A 9×9      │
  │    grid in black marker on cardboard; click any intersection to drop    │
  │    a cap, colors alternating red ↔ blue. As caps accumulate, three      │
  │    italic lines reveal in sequence — Osaka, the cooler, the year        │
  │    after the wedding. A small "wipe" link clears the board (revealed    │
  │    prose stays). Subtext stays subtext; the page never editorializes.   │
  │                                                                          │
  │  For AI (terse):                                                         │
  │    loads: ../../js/child.js (for the kaomoji cosmetic toggle)           │
  │    inline route-guards: !intro_seen → ../splash.html; death → ../death  │
  │    DOM: .bc-scene > .bc-board (svg.bc-grid + .bc-cells > 81 .bc-cell),  │
  │      .bc-prose (1 static <p> + 3 .reveal[data-reveal] <p>), a.bc-wipe,  │
  │      a.bc-back                                                          │
  │    flow: IIFE builds 81 .bc-cell divs into .bc-cells; click → place()   │
  │      drops <img.bc-cap> w/ CAPS[nextIdx] (red first), toggles nextIdx,  │
  │      bumps placedCount, maybeReveal() walks REVEAL_AT=[1,6,14] vs       │
  │      placedCount + adds .shown to next .reveal (revealIdx persists).    │
  │      Wipe clears caps + data-occupied, resets count/color, leaves       │
  │      revealed prose shown.                                              │
  │    storage R/W: writes wendys_palace_child.cosmetics.bottlecap via      │
  │      Child.setCosmetic; ownership tracked in wendys_palace_giftshop,    │
  │      key='bottlecap', by giftshopindex.html                             │
  │    routes out: giftshopindex.html (← Back to the Gift Shop)             │
  │                                                                          │
  └──────────────────────────────────────────────────────────────────────────┘
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bottle Cap</title>
  <script>(function(){try{if(localStorage.getItem('wendys_palace_intro_seen')!=='1'){location.replace('../splash.html');return;}var d=JSON.parse(localStorage.getItem('wendys_palace_death')||'{}');if(d.dead){location.replace('../death.html');return;}}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at center, #1a0e08 0%, #0a0604 70%, #020100 100%);
      color: #d8c8b0;
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
    }
    .bc-scene {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 22px 60px;
      gap: 28px;
      position: relative;
    }

    .bc-board {
      position: relative;
      width: min(420px, 92vw);
      aspect-ratio: 1;
      padding: 30px;
      background:
        radial-gradient(circle at 12% 18%, rgba(0,0,0,0.06) 0 1px, transparent 1px),
        radial-gradient(circle at 76% 38%, rgba(0,0,0,0.05) 0 1px, transparent 1px),
        radial-gradient(circle at 38% 76%, rgba(0,0,0,0.06) 0 1px, transparent 1px),
        radial-gradient(circle at 88% 84%, rgba(0,0,0,0.05) 0 1px, transparent 1px),
        linear-gradient(135deg, #c8a878 0%, #b8966a 50%, #9a8050 100%);
      border: 2px solid #4a3018;
      box-shadow:
        inset 0 0 36px rgba(40, 22, 8, 0.35),
        0 18px 38px rgba(0, 0, 0, 0.7);
    }
    .bc-grid {
      position: absolute;
      top: 30px;
      left: 30px;
      width: calc(100% - 60px);
      height: calc(100% - 60px);
      pointer-events: none;
    }
    .bc-grid line {
      stroke: #1a0a04;
      stroke-width: 2;
      stroke-linecap: round;
    }
    .bc-grid circle {
      fill: #1a0a04;
    }
    .bc-cells {
      position: absolute;
      top: 30px;
      left: 30px;
      width: calc(100% - 60px);
      height: calc(100% - 60px);
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
    }
    .bc-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s ease;
    }
    .bc-cell:hover:not([data-occupied]) {
      background: rgba(255, 220, 160, 0.10);
    }
    .bc-cap {
      width: 84%;
      height: 84%;
      object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
      pointer-events: none;
      animation: bc-drop 180ms ease-out;
    }
    @keyframes bc-drop {
      from { transform: translateY(-6px) scale(0.92); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }

    .bc-prose {
      max-width: 580px;
      text-align: center;
      font-size: 19px;
      line-height: 1.6;
      color: rgba(216, 200, 176, 0.92);
      font-style: italic;
    }
    .bc-prose p { margin: 0 0 14px; }
    .bc-prose p:last-child { margin: 0; }
    .bc-prose .em {
      font-style: normal;
      color: #f0c890;
      letter-spacing: 0.02em;
    }
    .bc-prose .reveal {
      opacity: 0;
      max-height: 0;
      margin-bottom: 0;
      overflow: hidden;
      transition: opacity 0.9s ease, max-height 0.9s ease, margin-bottom 0.9s ease;
    }
    .bc-prose .reveal.shown {
      opacity: 1;
      max-height: 240px;
      margin-bottom: 14px;
    }

    .bc-wipe {
      font-family: 'Special Elite', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: rgba(216, 200, 176, 0.4);
      text-decoration: none;
      text-transform: lowercase;
      cursor: pointer;
      padding: 4px 10px;
    }
    .bc-wipe:hover { color: rgba(216, 200, 176, 0.78); }

    .kc-bay {
      display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 6px;
    }
    .kc-preview {
      font-family: 'Special Elite', monospace; font-size: 22px; letter-spacing: 0.04em;
      color: #d8c8b0; background: rgba(20,14,10,0.55);
      border: 1px solid rgba(201,161,74,0.35); border-radius: 4px;
      padding: 10px 18px; min-width: 160px; text-align: center;
      white-space: pre; line-height: 1.1;
    }
    .kc-toggle {
      font-family: 'Special Elite', monospace; font-size: 14px;
      letter-spacing: 0.26em; text-transform: uppercase; color: #d8c8b0;
      padding: 12px 26px; background: rgba(20,14,10,0.7);
      border: 1px solid rgba(201,161,74,0.5); border-radius: 4px;
      cursor: pointer; min-width: 240px;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .kc-toggle:hover { background: rgba(201,161,74,0.16); border-color: #c9a14a; }
    .kc-toggle.on { background: rgba(201,161,74,0.22); border-color: #d4b46a; color: #f0d890; }

    .bc-back {
      display: inline-block;
      padding: 9px 22px;
      font-family: 'Special Elite', monospace;
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #d8c8b0;
      text-decoration: none;
      border: 1px solid rgba(201, 161, 74, 0.45);
      border-radius: 3px;
      background: rgba(20, 14, 10, 0.6);
    }
    .bc-back:hover {
      background: rgba(201, 161, 74, 0.15);
      border-color: #c9a14a;
    }
  </style>
</head>
<body>
  <div class="bc-scene">
    <div class="bc-board">
      <svg class="bc-grid" viewBox="0 0 360 360" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <line x1="20" y1="20" x2="340" y2="20"/>
        <line x1="20" y1="60" x2="340" y2="60"/>
        <line x1="20" y1="100" x2="340" y2="100"/>
        <line x1="20" y1="140" x2="340" y2="140"/>
        <line x1="20" y1="180" x2="340" y2="180"/>
        <line x1="20" y1="220" x2="340" y2="220"/>
        <line x1="20" y1="260" x2="340" y2="260"/>
        <line x1="20" y1="300" x2="340" y2="300"/>
        <line x1="20" y1="340" x2="340" y2="340"/>
        <line x1="20" y1="20" x2="20" y2="340"/>
        <line x1="60" y1="20" x2="60" y2="340"/>
        <line x1="100" y1="20" x2="100" y2="340"/>
        <line x1="140" y1="20" x2="140" y2="340"/>
        <line x1="180" y1="20" x2="180" y2="340"/>
        <line x1="220" y1="20" x2="220" y2="340"/>
        <line x1="260" y1="20" x2="260" y2="340"/>
        <line x1="300" y1="20" x2="300" y2="340"/>
        <line x1="340" y1="20" x2="340" y2="340"/>
        <circle cx="100" cy="100" r="3.5"/>
        <circle cx="260" cy="100" r="3.5"/>
        <circle cx="100" cy="260" r="3.5"/>
        <circle cx="260" cy="260" r="3.5"/>
        <circle cx="180" cy="180" r="3.5"/>
      </svg>
      <div class="bc-cells"></div>
    </div>

    <div class="bc-prose">
      <p>A pizza box of his. Nine by nine, in permanent marker. Bottle caps for stones.</p>
      <p class="reveal" data-reveal="1">Ray learned it in Osaka. Grandma Doreen — loaded — paid for the year.</p>
      <p class="reveal" data-reveal="2">Reds were his. Whatever else was in the cooler was yours.</p>
      <p class="reveal" data-reveal="3">You always won.</p>
    </div>

    <a class="bc-wipe" href="#" role="button">wipe the board</a>

    <div class="kc-bay">
      <div class="kc-preview" id="kc-preview" aria-hidden="true">(o_o)</div>
      <button class="kc-toggle" type="button" aria-pressed="false">Pin the cap on them</button>
    </div>

    <a class="bc-back" href="giftshopindex.html">← Back to the Gift Shop</a>
  </div>

  <script src="../../js/child.js"></script>
  <script>
    (function () {
      const ID = 'bottlecap';
      const OFF = 'Pin the cap on them';
      const ON  = 'Pry the cap off';
      const btn  = document.querySelector('.kc-toggle');
      const prev = document.getElementById('kc-preview');
      if (!btn || !window.Child) return;
      function refresh() {
        const on = Child.getCosmetic(ID);
        btn.classList.toggle('on', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        btn.textContent = on ? ON : OFF;
      }
      let pi = 0;
      function tick() {
        if (!prev) return;
        const d = Child.describeFace();
        prev.textContent = d.frames[pi % d.frames.length];
        pi++;
      }
      btn.addEventListener('click', () => Child.setCosmetic(ID, !Child.getCosmetic(ID)));
      Child.onChange(refresh);
      refresh();
      tick();
      setInterval(tick, 420);
    })();
  </script>

  <script>
    (function () {
      const grid = document.querySelector('.bc-cells');
      const reveals = Array.from(document.querySelectorAll('.bc-prose .reveal'));
      const wipe = document.querySelector('.bc-wipe');
      if (!grid) return;

      const CAPS = [
        '../../assets/images/bottlecapred.png',
        '../../assets/images/bottlecapblue.png'
      ];
      const REVEAL_AT = [1, 6, 14];
      const SIZE = 9;
      let placedCount = 0;
      let nextIdx = 0;
      let revealIdx = 0;
      const cells = [];

      function maybeReveal() {
        while (revealIdx < reveals.length && placedCount >= REVEAL_AT[revealIdx]) {
          reveals[revealIdx].classList.add('shown');
          revealIdx++;
        }
      }

      function place(cell) {
        if (cell.dataset.occupied) return;
        cell.dataset.occupied = '1';
        const img = document.createElement('img');
        img.src = CAPS[nextIdx];
        img.className = 'bc-cap';
        img.alt = '';
        cell.appendChild(img);
        nextIdx = 1 - nextIdx;
        placedCount++;
        maybeReveal();
      }

      for (let i = 0; i < SIZE * SIZE; i++) {
        const c = document.createElement('div');
        c.className = 'bc-cell';
        c.addEventListener('click', () => place(c));
        grid.appendChild(c);
        cells.push(c);
      }

      if (wipe) {
        wipe.addEventListener('click', (e) => {
          e.preventDefault();
          for (const c of cells) {
            delete c.dataset.occupied;
            c.innerHTML = '';
          }
          placedCount = 0;
          nextIdx = 0;
        });
      }
    })();
  </script>
</body>
</html>
