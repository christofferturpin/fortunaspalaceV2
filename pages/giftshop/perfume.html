<!DOCTYPE html>
<!--
  ┌──────────────────────────────────────────────────────────────────────────┐
  │  GIFT SHOP — PERFUME ("Tea Rose" sample, 800 coins)                     │
  ├──────────────────────────────────────────────────────────────────────────┤
  │                                                                          │
  │  For humans:                                                             │
  │    Item page for a discontinued Tea Rose perfume sample — the kind of    │
  │    scent a Belk's perfume counter would have sprayed on you. Pink        │
  │    interactive bottle: click/tap/space sprays a puff and ejects a        │
  │    cloud of floating words drawn from a token list (black tea, rose      │
  │    absolute, the back room, hairspray, the silence, dinner table,        │
  │    things not discussed). The smell of childhood is the prose — no       │
  │    static text body, only the mist.                                      │
  │                                                                          │
  │  For AI (terse):                                                         │
  │    loads: ../../js/child.js (for the kaomoji cosmetic toggle)           │
  │    inline route-guards: !intro_seen → ../splash.html; death → ../death  │
  │    DOM: .pf-scene > .pf-bottle-wrap > #pf-bottle (.pf-nozzle, .pf-puff, │
  │      #pf-spray, .pf-cap/collar/body/label), #pf-hint                    │
  │    flow: inline IIFE: TOKENS[] of scent/memory words; click/Enter/Space │
  │      → spritz(): toggle .spritzing for puff anim + spawn 9-13 .pf-mist- │
  │      word spans via WAAPI translate/scale/blur over 2.2-3.6s            │
  │    storage R/W: writes wendys_palace_child.cosmetics.perfume via        │
  │      Child.setCosmetic; ownership tracked in wendys_palace_giftshop,    │
  │      key='perfume', by giftshopindex.html                               │
  │    routes out: giftshopindex.html (← Back to the Gift Shop)             │
  │                                                                          │
  └──────────────────────────────────────────────────────────────────────────┘
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tea Rose</title>
  <script>(function(){try{if(localStorage.getItem('wendys_palace_intro_seen')!=='1'){location.replace('../splash.html');return;}var d=JSON.parse(localStorage.getItem('wendys_palace_death')||'{}');if(d.dead){location.replace('../death.html');return;}}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Special+Elite&family=Limelight&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 30% 20%, #f8e4d8 0%, #e8c4b0 40%, #c89888 100%);
      color: #3a1818;
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
    }
    .pf-scene {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 60px 22px;
      position: relative;
    }

    .pf-bottle-wrap {
      display: flex;
      justify-content: center;
    }
    .pf-bottle {
      width: 160px;
      height: 260px;
      position: relative;
      filter: drop-shadow(0 18px 30px rgba(120, 40, 60, 0.4));
      cursor: pointer;
      transition: filter 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .pf-bottle:hover {
      filter:
        drop-shadow(0 18px 30px rgba(120, 40, 60, 0.4))
        drop-shadow(0 0 18px rgba(255, 220, 220, 0.5));
    }
    .pf-bottle:focus { outline: none; }
    .pf-bottle:focus-visible {
      filter:
        drop-shadow(0 18px 30px rgba(120, 40, 60, 0.4))
        drop-shadow(0 0 20px rgba(255, 220, 220, 0.7));
    }
    .pf-cap {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 50px;
      background:
        linear-gradient(180deg, #f4d8a8 0%, #b88840 60%, #6a4818 100%);
      border-radius: 8px 8px 4px 4px;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.4);
    }
    .pf-collar {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 14px;
      background: linear-gradient(180deg, #d8d0c0 0%, #6a6058 100%);
      border-radius: 2px;
    }
    .pf-body {
      position: absolute;
      top: 64px;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 30%),
        linear-gradient(180deg, #f8c0d4 0%, #d06080 50%, #8a2848 100%);
      border-radius: 12px 12px 24px 24px;
      border: 1px solid rgba(100, 30, 50, 0.5);
      box-shadow:
        inset 0 -20px 30px rgba(80, 20, 40, 0.4),
        inset 8px 0 14px rgba(255, 200, 220, 0.3);
    }
    .pf-label {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 240, 230, 0.92);
      padding: 14px 22px;
      border: 2px solid rgba(100, 30, 50, 0.55);
      text-align: center;
      box-shadow:
        0 4px 8px rgba(0,0,0,0.3),
        inset 0 0 12px rgba(200, 100, 130, 0.15);
    }
    .pf-label-name {
      font-family: 'Limelight', serif;
      font-size: 18px;
      letter-spacing: 0.18em;
      color: #5a1828;
    }
    .pf-label-sub {
      font-family: 'Special Elite', monospace;
      font-size: 9px;
      letter-spacing: 0.24em;
      color: #6a3848;
      margin-top: 4px;
    }

    .pf-nozzle {
      position: absolute;
      top: 22px;
      left: 115px;
      width: 9px;
      height: 6px;
      background: linear-gradient(90deg, #3a2810 0%, #6a4818 55%, #2a1808 100%);
      border-radius: 0 2px 2px 0;
      box-shadow: 1px 0 0 rgba(255, 240, 200, 0.18);
      z-index: 3;
    }
    .pf-puff {
      position: absolute;
      top: 16px;
      left: 124px;
      width: 95px;
      height: 50px;
      background:
        radial-gradient(ellipse at 8% 50%,
          rgba(255, 255, 255, 0.78) 0%,
          rgba(255, 240, 230, 0.5) 28%,
          rgba(255, 220, 220, 0.25) 55%,
          transparent 80%);
      filter: blur(5px);
      opacity: 0;
      pointer-events: none;
      transform-origin: left center;
      z-index: 2;
    }
    .pf-bottle.spritzing .pf-puff {
      animation: pf-puff 0.75s ease-out;
    }
    @keyframes pf-puff {
      0%   { opacity: 0;   transform: scaleX(0.18) scaleY(0.55); }
      18%  { opacity: 0.95; transform: scaleX(0.85) scaleY(0.85); }
      55%  { opacity: 0.6;  transform: scaleX(1.9) scaleY(1.35) translateX(8px); }
      100% { opacity: 0;   transform: scaleX(2.9) scaleY(1.55) translateX(26px); }
    }

    .pf-spray {
      position: absolute;
      top: 25px;
      left: 124px;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 4;
    }
    .pf-mist-word {
      position: absolute;
      top: 0;
      left: 0;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: rgba(90, 24, 40, 0.85);
      white-space: nowrap;
      letter-spacing: 0.02em;
      text-shadow:
        0 0 6px rgba(255, 240, 230, 0.9),
        0 0 14px rgba(255, 220, 220, 0.4);
      pointer-events: none;
      transform-origin: left center;
      will-change: transform, opacity;
    }
    .pf-mist-word.emph {
      font-family: 'Limelight', serif;
      font-style: normal;
      letter-spacing: 0.1em;
      color: rgba(58, 10, 24, 0.88);
    }
    .pf-mist-word.note {
      font-family: 'Special Elite', monospace;
      font-style: normal;
      text-transform: lowercase;
      letter-spacing: 0.12em;
      color: rgba(106, 56, 72, 0.85);
    }

    .pf-hint {
      font-family: 'Special Elite', monospace;
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: lowercase;
      color: rgba(90, 24, 40, 0.45);
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
    .pf-hint.faded { opacity: 0; }

    .kc-bay {
      display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 6px;
    }
    .kc-preview {
      font-family: 'Special Elite', monospace; font-size: 22px; letter-spacing: 0.04em;
      color: #3a1818; background: rgba(255,240,230,0.7);
      border: 1px solid rgba(120,40,60,0.35); border-radius: 4px;
      padding: 10px 18px; min-width: 160px; text-align: center;
      white-space: pre; line-height: 1.1;
    }
    .kc-toggle {
      font-family: 'Special Elite', monospace; font-size: 14px;
      letter-spacing: 0.24em; text-transform: uppercase; color: #5a1828;
      padding: 12px 26px; background: rgba(255,240,230,0.7);
      border: 1px solid rgba(120,40,60,0.5); border-radius: 4px;
      cursor: pointer; min-width: 280px;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .kc-toggle:hover { background: rgba(184,80,112,0.18); border-color: #b85070; }
    .kc-toggle.on { background: rgba(184,80,112,0.25); border-color: #8a2848; color: #2a0810; }

    .pf-back {
      padding: 9px 22px;
      font-family: 'Special Elite', monospace;
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #5a1828;
      text-decoration: none;
      border: 1px solid rgba(120, 40, 60, 0.45);
      border-radius: 3px;
      background: rgba(255, 240, 230, 0.5);
    }
    .pf-back:hover {
      background: rgba(184, 80, 112, 0.18);
      border-color: #b85070;
    }
    @media (prefers-reduced-motion: reduce) {
      .pf-puff { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="pf-scene">
    <div class="pf-bottle-wrap">
      <div class="pf-bottle" id="pf-bottle">
        <div class="pf-nozzle"></div>
        <div class="pf-puff"></div>
        <div class="pf-spray" id="pf-spray"></div>
        <div class="pf-cap"></div>
        <div class="pf-collar"></div>
        <div class="pf-body">
          <div class="pf-label">
            <div class="pf-label-name">TEA ROSE</div>
            <div class="pf-label-sub">PERFUME YOUR AUNT WORE</div>
          </div>
        </div>
      </div>
    </div>

    <div class="pf-hint" id="pf-hint">— press —</div>

    <div class="kc-bay">
      <div class="kc-preview" id="kc-preview" aria-hidden="true">(o_o)</div>
      <button class="kc-toggle" type="button" aria-pressed="false">Scent the air around them</button>
    </div>

    <a class="pf-back" href="giftshopindex.html">← Back to the Gift Shop</a>
  </div>

  <script src="../../js/child.js"></script>
  <script>
    (function () {
      const ID = 'perfume';
      const OFF = 'Scent the air around them';
      const ON  = 'Air them out';
      const btn  = document.querySelector('.kc-toggle');
      const prev = document.getElementById('kc-preview');
      if (!btn || !window.Child) return;
      function refresh() {
        const on = Child.getCosmetic(ID);
        btn.classList.toggle('on', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        btn.textContent = on ? ON : OFF;
      }
      let pi = 0;
      function tick() {
        if (!prev) return;
        const d = Child.describeFace();
        prev.textContent = d.frames[pi % d.frames.length];
        pi++;
      }
      btn.addEventListener('click', () => Child.setCosmetic(ID, !Child.getCosmetic(ID)));
      Child.onChange(refresh);
      refresh();
      tick();
      setInterval(tick, 420);
    })();
  </script>

  <script>
    (function () {
      const bottle = document.getElementById('pf-bottle');
      const spray = document.getElementById('pf-spray');
      const hint = document.getElementById('pf-hint');
      if (!bottle || !spray) return;

      const TOKENS = [
        { text: 'black tea',        cls: 'note' },
        { text: 'black',            cls: 'note' },
        { text: 'tea',              cls: 'note' },
        { text: 'rose absolute',    cls: 'note' },
        { text: 'rose',             cls: '' },
        { text: 'absolute',         cls: 'emph' },
        { text: 'the back room',    cls: '' },
        { text: 'back room',        cls: '' },
        { text: 'a chain department store', cls: '' },
        { text: 'department store', cls: '' },
        { text: 'chain',            cls: '' },
        { text: 'store',            cls: '' },
        { text: 'hairspray',        cls: 'emph' },
        { text: 'hair',             cls: '' },
        { text: 'spray',            cls: '' },
        { text: 'the silence',      cls: 'emph' },
        { text: 'silence',          cls: 'emph' },
        { text: 'a dinner table',   cls: '' },
        { text: 'dinner table',     cls: '' },
        { text: 'where things',     cls: '' },
        { text: 'not discussed',    cls: 'emph' },
        { text: 'discussed',        cls: 'emph' },
        { text: 'things',           cls: '' },
        { text: 'your mother',           cls: 'emph' },
        { text: 'things',           cls: 'emph' },
        { text: 'what happened',           cls: 'emph' },
        
      ];

      bottle.setAttribute('role', 'button');
      bottle.setAttribute('tabindex', '0');
      bottle.setAttribute('aria-label', 'Spray the perfume');

      let pressed = false;
      let pressTimer = null;

      function spawn(delayMs) {
        const tok = TOKENS[Math.floor(Math.random() * TOKENS.length)];
        const el = document.createElement('span');
        el.className = 'pf-mist-word' + (tok.cls ? ' ' + tok.cls : '');
        el.textContent = tok.text;

        const size = 14 + Math.random() * 10;
        el.style.fontSize = size + 'px';
        el.style.top = (-size * 0.55) + 'px';

        const reach = 170 + Math.random() * 240;
        const spread = 90;
        const dx = reach;
        const dy = (Math.random() - 0.5) * spread;
        const driftX = dx + 30 + Math.random() * 60;
        const driftY = dy + (Math.random() - 0.5) * 50;
        const blurMid = (Math.random() * 0.6).toFixed(2);
        const rot = (Math.random() - 0.5) * 12;

        const duration = 2200 + Math.random() * 1400;

        spray.appendChild(el);
        const anim = el.animate(
          [
            {
              transform: 'translate(0, 0) scale(0.5) rotate(0deg)',
              opacity: 0,
              filter: 'blur(2px)',
            },
            {
              offset: 0.14,
              transform: `translate(${dx * 0.22}px, ${dy * 0.2}px) scale(1) rotate(${rot * 0.3}deg)`,
              opacity: 0.95,
              filter: `blur(${blurMid}px)`,
            },
            {
              offset: 0.7,
              transform: `translate(${dx}px, ${dy}px) scale(1.04) rotate(${rot}deg)`,
              opacity: 0.6,
              filter: `blur(${blurMid}px)`,
            },
            {
              transform: `translate(${driftX}px, ${driftY}px) scale(1.08) rotate(${rot * 1.4}deg)`,
              opacity: 0,
              filter: 'blur(2.5px)',
            },
          ],
          { duration, easing: 'cubic-bezier(0.2, 0.7, 0.3, 1)', delay: delayMs }
        );
        anim.onfinish = () => el.remove();
      }

      function spritz() {
        bottle.classList.remove('spritzing');
        void bottle.offsetWidth;
        bottle.classList.add('spritzing');
        if (pressTimer) clearTimeout(pressTimer);
        pressTimer = setTimeout(() => bottle.classList.remove('spritzing'), 750);

        const count = 9 + Math.floor(Math.random() * 5);
        for (let i = 0; i < count; i++) {
          spawn(i * 35 + Math.random() * 40);
        }

        if (!pressed) {
          pressed = true;
          if (hint) hint.classList.add('faded');
        }
      }

      bottle.addEventListener('click', spritz);
      bottle.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          spritz();
        }
      });
    })();
  </script>
</body>
</html>
